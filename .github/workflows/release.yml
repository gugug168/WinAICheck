name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Run tests
        run: bun run test:all

      - name: Run ground truth audit
        run: bun run scripts/audit.ts --ci

      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build exe
        run: bun run build

      - name: Package as ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/WinAICheck.exe -DestinationPath dist/WinAICheck-${{ steps.version.outputs.VERSION }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: WinAICheck v${{ steps.version.outputs.VERSION }}
          body: |
            Windows AI 开发环境一键诊断与修复工具

            ## 安装方式

            ### PowerShell 一键安装（推荐）
            ```powershell
            irm https://raw.githubusercontent.com/gugug168/WinAICheck/main/install.ps1 | iex
            ```

            ### npm / npx
            ```bash
            npx winaicheck
            ```

            ### 手动下载
            下载下方 `WinAICheck-x.x.x.zip`（解压后双击运行），或直接下载 `WinAICheck.exe`。

            > **杀毒软件误报说明**：WinAICheck 可能被 360、Defender 等误报为病毒，这是误报。请将 exe 添加到杀毒软件的信任区/白名单后再运行。
          files: |
            dist/WinAICheck.exe
            dist/WinAICheck-${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
